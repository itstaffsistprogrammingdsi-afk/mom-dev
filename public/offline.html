<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#f7f2ea">
        <title>Offline — MoM</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f7f2ea;
                --surface: #ffffff;
                --text: #221f1b;
                --muted: #6b625a;
                --border: #e7e0d8;
                --primary: #2552b1;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #12100e;
                    --surface: #1a1815;
                    --text: #f2ede6;
                    --muted: #a69d93;
                    --border: #2e2a25;
                    --primary: #8fb0f5;
                }
            }
            * { box-sizing: border-box; }
            body {
                min-height: 100svh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                background: var(--bg);
                color: var(--text);
                font-family: 'Plus Jakarta Sans', Inter, ui-sans-serif, system-ui, sans-serif;
            }
            main {
                width: min(100%, 420px);
                padding: 32px;
                border: 1px solid var(--border);
                border-radius: 16px;
                background: var(--surface);
                text-align: center;
            }
            h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
            p { margin: 12px 0 0; color: var(--muted); line-height: 1.6; }
            button {
                min-height: 44px;
                margin-top: 24px;
                padding: 0 20px;
                border: 0;
                border-radius: 10px;
                background: var(--primary);
                color: #fff;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Tidak ada koneksi</h1>
            <p>MoM membutuhkan koneksi untuk memuat notulen terbaru. Perubahan yang belum tersimpan akan disinkronkan saat koneksi kembali.</p>
            <button type="button" onclick="window.location.reload()">Coba lagi</button>
        </main>
    </body>
</html>
